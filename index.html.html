document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n\n:root {\n  /* ----------------------------------------------------------\n     COLOR TOKENS — Neon Mint\n     ---------------------------------------------------------- */\n  --mint-50:  #ECFDF5;\n  --mint-100: #D1FAE5;\n  --mint-200: #A7F3D0;\n  --mint-300: #6EE7B7;\n  --mint-400: #34D399;\n  --mint-500: #10B981; /* PRIMARY */\n  --mint-600: #0BA372;\n  --mint-700: #058B5F;\n  --mint-800: #04694A;\n  --mint-900: #053D2C;\n  --mint-950: #022118;\n\n  /* ----------------------------------------------------------\n     COLOR TOKENS — Ink (cool neutral, slight green undertone)\n     ---------------------------------------------------------- */\n  --ink-50:   #F5F7F6;\n  --ink-100:  #E8ECEA;\n  --ink-200:  #D2D9D5;\n  --ink-300:  #ADB7B2;\n  --ink-400:  #828D88;\n  --ink-500:  #5C6661;\n  --ink-600:  #404846;\n  --ink-700:  #2A3230;\n  --ink-800:  #1A201E;\n  --ink-900:  #0E1413;\n  --ink-950:  #060908;\n\n  /* ----------------------------------------------------------\n     COLOR TOKENS — Canvas (off-whites; warm-cool balance)\n     ---------------------------------------------------------- */\n  --canvas:        #FAFBFA;\n  --canvas-warm:   #F5F2EC; /* paper-tinted */\n  --white:         #FFFFFF;\n\n  /* ----------------------------------------------------------\n     COLOR TOKENS — Accents (used sparingly)\n     ---------------------------------------------------------- */\n  --coral-500: #FF6B47;  /* warm contrast — alerts, hot CTAs */\n  --amber-500: #F7B538;  /* highlight, badges */\n  --plum-500:  #6B4E9A;  /* secondary accent, illustrations */\n\n  /* ----------------------------------------------------------\n     SEMANTIC — Surfaces & FG\n     ---------------------------------------------------------- */\n  --bg-canvas:    var(--canvas);\n  --bg-paper:     var(--white);\n  --bg-elevated:  var(--white);\n  --bg-sunken:    var(--ink-50);\n  --bg-ink:       var(--ink-950);     /* dark-mode surface */\n  --bg-ink-2:     var(--ink-900);\n\n  --fg-1:         var(--ink-950);     /* primary text */\n  --fg-2:         var(--ink-600);     /* secondary, supporting */\n  --fg-3:         var(--ink-400);     /* tertiary, captions */\n  --fg-4:         var(--ink-300);     /* hairline disabled */\n  --fg-inv-1:     var(--canvas);      /* primary on dark */\n  --fg-inv-2:     var(--ink-300);\n  --fg-brand:     var(--mint-500);\n  --fg-on-brand:  var(--ink-950);     /* text sitting on mint */\n\n  --border-1:     var(--ink-100);\n  --border-2:     var(--ink-200);\n  --border-strong:var(--ink-900);\n  --border-brand: var(--mint-500);\n\n  /* ----------------------------------------------------------\n     SEMANTIC — Status\n     ---------------------------------------------------------- */\n  --success:      var(--mint-500);\n  --success-bg:   var(--mint-50);\n  --warning:      var(--amber-500);\n  --warning-bg:   #FFF4DA;\n  --danger:       #E5484D;\n  --danger-bg:    #FFE9E9;\n  --info:         #3E63DD;\n  --info-bg:      #EAEFFF;\n\n  /* ----------------------------------------------------------\n     TYPE TOKENS\n     ---------------------------------------------------------- */\n  --font-display: \"Sora\", ui-sans-serif, system-ui, sans-serif;\n  --font-body:    \"Outfit\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Display sizes — used for marketing heroes; tighter line-height */\n  --fs-display-2xl: clamp(56px, 8.4vw, 128px);\n  --fs-display-xl:  clamp(48px, 6.4vw, 96px);\n  --fs-display-lg:  clamp(40px, 4.8vw, 72px);\n  --fs-display-md:  clamp(32px, 3.6vw, 56px);\n\n  /* Heading sizes — used in body and product UI */\n  --fs-h1: 40px;\n  --fs-h2: 32px;\n  --fs-h3: 24px;\n  --fs-h4: 20px;\n  --fs-h5: 17px;\n  --fs-h6: 15px;\n\n  /* Body sizes */\n  --fs-body-lg: 19px;\n  --fs-body:    16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 12px;\n  --fs-micro:   11px;\n\n  --lh-tight:   1.04;\n  --lh-snug:    1.18;\n  --lh-normal:  1.45;\n  --lh-relaxed: 1.6;\n\n  --tracking-tight:  -0.025em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n  --tracking-caps:   0.08em;\n\n  /* ----------------------------------------------------------\n     SPACING & LAYOUT\n     ---------------------------------------------------------- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ----------------------------------------------------------\n     RADII\n     ---------------------------------------------------------- */\n  --r-xs:  4px;\n  --r-sm:  8px;\n  --r-md:  12px;\n  --r-lg:  16px;\n  --r-xl:  22px;\n  --r-2xl: 28px;\n  --r-pill: 999px;\n\n  /* ----------------------------------------------------------\n     SHADOWS — Two flavors: soft (UI) and brand-glow (CTA)\n     ---------------------------------------------------------- */\n  --shadow-1: 0 1px 0 rgba(14, 20, 19, 0.04), 0 1px 2px rgba(14, 20, 19, 0.05);\n  --shadow-2: 0 2px 4px rgba(14, 20, 19, 0.04), 0 6px 14px rgba(14, 20, 19, 0.06);\n  --shadow-3: 0 8px 24px rgba(14, 20, 19, 0.08), 0 24px 48px rgba(14, 20, 19, 0.06);\n  --shadow-glow: 0 0 0 1px rgba(16, 185, 129, 0.18), 0 8px 28px rgba(16, 185, 129, 0.28);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);\n\n  /* ----------------------------------------------------------\n     MOTION\n     ---------------------------------------------------------- */\n  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n\n  --dur-1: 120ms;\n  --dur-2: 200ms;\n  --dur-3: 320ms;\n  --dur-4: 560ms;\n}\n\n/* ============================================================\n   ELEMENT DEFAULTS — Semantic styles for raw HTML\n   ============================================================ */\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  background: var(--bg-canvas);\n  color: var(--fg-1);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  font-weight: 400;\n  font-feature-settings: \"ss01\", \"cv02\";\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  color: var(--fg-1);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-tight);\n  font-weight: 600;\n  text-wrap: balance;\n  margin: 0;\n}\n\nh1 { font-size: var(--fs-h1); letter-spacing: var(--tracking-tight); font-weight: 700; }\nh2 { font-size: var(--fs-h2); letter-spacing: var(--tracking-tight); font-weight: 700; }\nh3 { font-size: var(--fs-h3); letter-spacing: var(--tracking-snug); }\nh4 { font-size: var(--fs-h4); letter-spacing: var(--tracking-snug); }\nh5 { font-size: var(--fs-h5); }\nh6 {\n  font-size: var(--fs-h6);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  color: var(--fg-2);\n  font-weight: 600;\n}\n\np {\n  margin: 0;\n  text-wrap: pretty;\n  color: var(--fg-1);\n}\n\nsmall, .caption {\n  font-size: var(--fs-caption);\n  color: var(--fg-3);\n  letter-spacing: var(--tracking-snug);\n}\n\na {\n  color: var(--fg-1);\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n  transition: color var(--dur-2) var(--ease-out);\n}\na:hover { color: var(--mint-700); }\n\ncode, kbd, samp, pre {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\ncode {\n  background: var(--bg-sunken);\n  border: 1px solid var(--border-1);\n  border-radius: var(--r-xs);\n  padding: 1px 6px;\n}\n\n/* ============================================================\n   UTILITY CLASSES — use sparingly, prefer semantic CSS\n   ============================================================ */\n\n.display-2xl { font: 800 var(--fs-display-2xl)/var(--lh-tight) var(--font-display); letter-spacing: -0.035em; }\n.display-xl  { font: 700 var(--fs-display-xl)/var(--lh-tight)  var(--font-display); letter-spacing: -0.03em; }\n.display-lg  { font: 700 var(--fs-display-lg)/var(--lh-tight)  var(--font-display); letter-spacing: -0.025em; }\n.display-md  { font: 700 var(--fs-display-md)/var(--lh-snug)   var(--font-display); letter-spacing: -0.02em; }\n\n.eyebrow {\n  font: 600 var(--fs-caption)/1 var(--font-body);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  color: var(--fg-2);\n}\n\n.mono { font-family: var(--font-mono); font-feature-settings: \"tnum\"; }\n.tnum { font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n\n<style>\n/* ============================================================\n   LAYOUT GLUE — anything not in the design system\n   ============================================================ */\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody { background: var(--bg-canvas); overflow-x: hidden; }\n\n.container {\n  width: 100%; max-width: 1280px; margin: 0 auto;\n  padding: 0 24px;\n}\n@media (min-width: 900px) { .container { padding: 0 64px; } }\n\n.section { padding: 96px 0; }\n.section-tight { padding: 64px 0; }\n.section-tall  { padding: 128px 0; }\n\n/* ── Lang toggle ── */\n.lang-fr .en { display: none; }\n.lang-en .fr { display: none; }\n\n/* ── Eyebrow / ink section ── */\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  font: 600 12px/1 var(--font-body);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  color: var(--fg-2);\n}\n.eyebrow .dot {\n  width: 6px; height: 6px; border-radius: 50%; background: var(--mint-500);\n  position: relative;\n}\n.eyebrow .dot::after {\n  content: \"\"; position: absolute; inset: -3px; border-radius: 50%;\n  background: var(--mint-500); opacity: 0.4;\n  animation: pulse-ring 1.8s var(--ease-out) infinite;\n}\n@keyframes pulse-ring {\n  0% { transform: scale(.6); opacity: .5; }\n  100% { transform: scale(1.8); opacity: 0; }\n}\n.ink-section {\n  background: var(--bg-ink);\n  color: var(--fg-inv-1);\n  position: relative;\n  overflow: hidden;\n}\n.ink-section .eyebrow { color: var(--ink-300); }\n.ink-section h2, .ink-section h3, .ink-section p { color: var(--fg-inv-1); }\n.grain {\n  position: absolute; inset: 0;\n  background-image: url(\"aed8745a-f183-412c-b683-5352e90ae48e\");\n  background-size: 320px;\n  opacity: 0.22;\n  mix-blend-mode: screen;\n  pointer-events: none;\n}\n.grain-light {\n  position: absolute; inset: 0;\n  background-image: url(\"aed8745a-f183-412c-b683-5352e90ae48e\");\n  background-size: 320px;\n  opacity: 0.05;\n  mix-blend-mode: multiply;\n  pointer-events: none;\n}\n\n/* ============================================================\n   BUTTONS\n   ============================================================ */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  font: 600 14px/1 var(--font-display);\n  letter-spacing: -0.01em;\n  padding: 14px 22px; border-radius: 999px;\n  border: 1px solid transparent;\n  cursor: pointer; text-decoration: none;\n  white-space: nowrap; position: relative;\n  transition: background var(--dur-2) var(--ease-out),\n              color var(--dur-2) var(--ease-out),\n              transform var(--dur-1) var(--ease-out),\n              box-shadow var(--dur-2) var(--ease-out);\n}\n.btn:active { transform: scale(.98); }\n.btn-arrow { width: 14px; height: 14px; transition: transform var(--dur-2) var(--ease-out); }\n.btn:hover .btn-arrow { transform: translate(3px, -3px); }\n\n.btn-primary {\n  background: var(--mint-500); color: var(--ink-950);\n  box-shadow: var(--shadow-glow);\n}\n.btn-primary:hover { background: var(--mint-400); }\n.btn-secondary { background: var(--ink-950); color: var(--canvas); }\n.btn-secondary:hover { background: var(--ink-800); }\n.btn-ghost {\n  background: transparent; color: var(--fg-1);\n  border-color: var(--border-2);\n}\n.btn-ghost:hover { background: var(--ink-50); }\n.btn-ghost.on-ink { color: var(--fg-inv-1); border-color: rgba(255,255,255,.18); }\n.btn-ghost.on-ink:hover { background: rgba(255,255,255,.06); }\n.btn-sm { padding: 10px 16px; font-size: 13px; }\n\n/* Mint chevron ornament (signature bullet) */\n.cv {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 18px; height: 18px;\n  background: var(--mint-500); color: var(--ink-950);\n  border-radius: 50%; flex-shrink: 0;\n}\n.cv svg { width: 9px; height: 9px; stroke: currentColor; stroke-width: 2.5; fill: none;\n  stroke-linecap: round; stroke-linejoin: round; }\n\n/* Reveal */\n.reveal { transition: opacity 720ms var(--ease-out), transform 720ms var(--ease-out); }\n.reveal.armed { opacity: 0; transform: translateY(28px); }\n.reveal.armed.in { opacity: 1; transform: none; }\n.reveal[data-delay=\"1\"] { transition-delay: 80ms; }\n.reveal[data-delay=\"2\"] { transition-delay: 160ms; }\n.reveal[data-delay=\"3\"] { transition-delay: 240ms; }\n.reveal[data-delay=\"4\"] { transition-delay: 320ms; }\n\n/* ============================================================\n   NAV\n   ============================================================ */\n.nav-shell {\n  position: sticky; top: 0; z-index: 50;\n  padding: 16px 0;\n  transition: padding var(--dur-3) var(--ease-out);\n}\n.nav-shell.is-scrolled { padding: 12px 0; }\n.nav-bar {\n  width: calc(100% - 32px); max-width: 1280px;\n  margin: 0 auto;\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 16px;\n  padding: 10px 12px 10px 18px;\n  background: rgba(250, 251, 250, 0.78);\n  backdrop-filter: blur(22px) saturate(140%);\n  -webkit-backdrop-filter: blur(22px) saturate(140%);\n  border: 1px solid var(--border-1);\n  border-radius: 999px;\n  box-shadow: 0 1px 0 rgba(14,20,19,.04);\n  transition: all var(--dur-3) var(--ease-out);\n}\n.is-scrolled .nav-bar { box-shadow: 0  gap: 0;\n  padding-top: 32px;\n  border-top: 1px solid var(--border-1);\n  position: relative;\n}\n.hero-stat {\n  display: flex; flex-direction: column; gap: 6px;\n  padding-right: 24px;\n  position: relative;\n}\n.hero-stat + .hero-stat {\n  padding-left: 32px;\n}\n.hero-stat + .hero-stat::before {\n  content: \"\"; position: absolute;\n  left: 0; top: 4px; bottom: 4px;\n  width: 1px; background: var(--border-1);\n}\n.hero-stat-num {\n  font: 800 clamp(36px, 4vw, 52px)/1 var(--font-display);\n  letter-spacing: -0.04em;\n  color: var(--fg-1);\n  font-variant-numeric: tabular-nums;\n  display: flex; align-items: baseline; gap: 2px;\n}\n.hero-stat-num .unit {\n  font-size: 0.55em; font-weight: 700;\n  color: var(--mint-700);\n  margin-left: 2px;\n}\n.hero-stat-num .pre {\n  font-size: 0.45em; font-weight: 600;\n  color: var(--fg-3);\n  letter-spacing: -0.01em;\n  margin-right: 4px;\n  align-self: center;\n  position: relative; top: -0.5em;\n}\n.hero-stat-label {\n  font: 500 13px/1.35 var(--font-body);\n  color: var(--fg-1);\n  max-width: 22ch;\n  text-wrap: balance;\n}\n.hero-stat-src {\n  margin-top: 4px;\n  font: 500 10px/1.2 var(--font-mono);\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--fg-3);\n}\n@media (max-width: 700px) {\n  .hero-stats { grid-template-columns: 1fr; gap: 20px; }\n  .hero-stat + .hero-stat { padding-left: 0; padding-top: 20px; border-top: 1px solid var(--border-1); }\n  .hero-stat + .hero-stat::before { display: none; }\n}\n\n/* HERO DECOR — flow diagram */\n.hero-decor {\n  position: relative;\n  aspect-ratio: 1 / 1.05;\n  max-width: 480px;\n  justify-self: end;\n  width: 100%;\n}\n.hero-decor svg { width: 100%; height: 100%; overflow: visible; }\n.flow-card {\n  position: absolute;\n  width: 46%;\n  padding: 9px 12px;\n  background: var(--bg-paper);\n  border: 1px solid var(--border-1);\n  border-radius: 10px;\n  font: 500 12px/1.35 var(--font-body);\n  color: var(--fg-1);\n  box-shadow: var(--shadow-2);\n  display: flex; flex-direction: column; gap: 4px;\n}\n.flow-in  { left: -8%; }\n.flow-out { right: -8%; }\n.flow-row-1 { top: 6%;  }\n.flow-row-2 { top: 44%; }\n.flow-row-3 { top: 82%; }\n.flow-tag {\n  display: inline-flex; align-items: center; gap: 4px;\n  font: 700 9px/1 var(--font-mono);\n  letter-spacing: 0.1em;\n  padding: 3px 6px; border-radius: 4px;\n  align-self: flex-start;\n}\n.flow-tag-in  { background: var(--ink-900); color: var(--canvas); }\n.flow-tag-out { background: var(--mint-500); color: var(--ink-950); }\n.flow-text {\n  font: 500 12px/1.25 var(--font-mono);\n  color: var(--fg-1); letter-spacing: -0.005em;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.flow-card.float-1  { animation: float-card 6s var(--ease-in-out) infinite; }\n.flow-card.float-2  { animation: float-card 6s var(--ease-in-out) -2s infinite; }\n.flow-card.float-3  { animation: float-card 6s var(--ease-in-out) -4s infinite; }\n.flow-card.float-1o { animation: float-card 6s var(--ease-in-out) -1s infinite; }\n.flow-card.float-2o { animation: float-card 6s var(--ease-in-out) -3s infinite; }\n.flow-card.float-3o { animation: float-card 6s var(--ease-in-out) -5s infinite; }\n@keyframes float-card {\n  0%, 100% { transform: translateY(0); }\n  50%      { transform: translateY(-8px); }\n}\n.flow-pulse {\n  fill: var(--mint-500);\n  filter: drop-shadow(0 0 8px rgba(16,185,129,.65));\n  offset-rotate: 0deg;\n  animation: travel 2.4s linear infinite;\n}\n.flow-pulse-out { animation-duration: 2.2s; }\n@keyframes travel {\n  0%   { offset-distance: 0%;   opacity: 0; }\n  10%  { opacity: 1; }\n  90%  { opacity: 1; }\n  100% { offset-distance: 100%; opacity: 0; }\n}\n\n@media (max-width: 1000px) {\n  .hero-inner { grid-template-columns: 1fr; gap: 64px; }\n  .hero-decor { max-width: 380px; justify-self: start; }\n}\n\n/* ============================================================\n   LOGO MARQUEE (tools we work with)\n   ======================================================== eets<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>n8n<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Odoo<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Airtable<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Sage<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Make<\u002Fspan>\n      <!-- duplicate for seamless loop -->\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Gmail<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Slack<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>HubSpot<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Notion<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Stripe<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Shopify<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Google Sheets<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>n8n<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Odoo<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Airtable<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Sage<\u002Fspan>\n      <span class=\"tool-mark\"><span class=\"tdot\"><\u002Fspan>Make<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     PROBLEM — ink fold\n============================================================ -->\n<section class=\"problem ink-section\">\n  <div class=\"grain\"><\u002Fdiv>\n  <div class=\"container problem-inner reveal\">\n    <div class=\"eyebrow\">\n      <span class=\"dot\"><\u002Fspan>\n      <span class=\"fr\">Le point de blocage<\u002Fspan>\n      <span class=\"en\">The stuck place<\u002Fspan>\n    <\u002Fdiv>\n\n    <h2 class=\"problem-headline\">\n      <span class=\"fr\">Vous avez acheté les outils.<br>Lu les case studies.<br>Suivi les webinars.<br><span class=\"dim\">— et rien n'a bougé.<\u002Fspan><\u002Fspan>\n      <span class=\"en\">You bought the tools.<br>Read the case studies.<br>Sat through the webinars.<br><span class=\"dim\">— and nothing shipped.<\u002Fspan><\u002Fspan>\n    <\u002Fh2>\n\n    <div class=\"problem-grid\">\n      <p class=\"problem-copy\">\n        <span class=\"fr\">Des mois plus tard, les licences dorment. Les pilotes calent à 80%. Et personne dans l'équipe ne se rappelle ce que le ROI était censé donner.<\u002Fspan>\n        <span class=\"en\">Months later, the licenses sit unused. The pilots stalled at 80%. And nobody on your team can explain what the ROI was supposed to look like.<\u002Fspan>\n      <\u002Fp>\n      <p class=\"problem-copy\">\n        <span class=\"fr\">Vous n'êtes pas en retard. Vous êtes coincé là où tout le monde se coince — entre une démo et un système qui marche. <strong>C'est exactement ce qu'on fait.<\u002Fstrong><\u002Fspan>\n        <span class=\"en\">You're not behind. You're stuck where everyone gets stuck — between a vendor demo and a working system. <strong>That's the job we do.<\u002Fstrong><\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"problem-promise\">\n      <img src=\"6cba87b6-69df-4365-8ab9-ad580df703c5\" alt=\"\" width=\"56\" height=\"56\">\n      <div class=\"pp-body\">\n        <div class=\"problem-promise-title\">Synopse<\u002Fdiv>\n        <div class=\"problem-promise-tag\">\n          <span class=\"fr\">— identifie ce qui mérite d'être automatisé, le construit, et reste jusqu'à ce que ça soit utilisé.<\u002Fspan>\n          <span class=\"en\">— defines what's worth building, builds it, and stays until your team actually uses it.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#booking\" class=\"btn btn-primary\">\n        <span class=\"fr\">Réserver un audit<\u002Fspan><span class=\"en\">Book a call<\u002Fspan>\n        <svg class=\"btn-arrow\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17 17 7\"><\u002Fpath><path d=\"M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     PROCESS — synapse arc\n============================================================ -->\n<section id=\"process\" class=\"process section-tall\">\n  <div class=\"container\">\n    <header class=\"process-head reveal\">\n      <div class=\"eyebrow\">\n        <span class=\"dot\"><\u002Fspan>\n        <span class=\"fr\">La méthode<\u002Fspan>\n        <span class=\"en\">How we work<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"process-title\">\n        <span class=\"fr\">Trois étapes. Pas plus.<br>Du problème au résultat.<\u002Fspan>\n        <span class=\"en\">Three steps. No more.<br>From problem to result.<\u002Fspan>\n      <\u002Fh2>\n      <p class=\"process-sub\">\n        <span class=\"fr\">Pas de POC interminable. Pas de réunion de cadrage qui n'en finit plus. On livre vite, on mesure, on ajuste.<\u002Fspan>\n        <span class=\"en\">No endless POC. No kickoff meetings that go nowhere. We deliver fast, measure, improve.<\u002Fspan>\n      <\u002Fp>\n    <\u002Fheader>\n\n    <div class=\"process-stage\">\n      <div class=\"process-arc reveal\">\n        <svg viewBox=\"0 0 440 440\" preserveAspectRatio=\"xMidYMid meet\" id=\"procArc\">\n          <!-- background ticks -->\n          <g stroke=\"var(--border-1)\" stroke-width=\"1\" opacity=\"0.7\">\n            <line x1=\"80\" y1=\"40\" x2=\"80\" y2=\"50\"><\u002Fline>\n            <line x1=\"160\" y1=\"40\" x2=\"160\" y2=\"50\"><\u002Fline>\n            <line x1=\"240\" y1=\"40\" x2=\"240\" y2=\"50\"><\u002Fline>\n            <line x1=\"320\" y1=\"40\" x2=\"320\" y2=\"50\"><\u002Fline>\n            <line x1=\"40\" y1=\"80\" x2=\"50\" y2=\"80\"><\u002Fline>\n            <line x1=\"40\" y1=\"160\" x2=\"50\" y2=\"160\"><\u002Fline>\n            <line x1=\"40\" y1=\"240\" x2=\"50\" y2=\"240\"><\u002Fline>\n            <line x1=\"40\" y1=\"320\" x2=\"50\" y2=\"320\"><\u002Fline>\n          <\u002Fg>\n          <!-- arc paths -->\n          <path id=\"arc1\" class=\"process-arc-path is-active\" d=\"M 80 80 C 80 180, 220 180, 220 220\"><\u002Fpath>\n          <path id=\"arc2\" class=\"process-arc-path\" d=\"M 220 220 C 220 320, 360 320, 360 360\"><\u002Fpath>\n\n          <!-- nodes -->\n          <g id=\"node1\">\n            <circle cx=\"80\" cy=\"80\" r=\"18\" fill=\"var(--ink-950)\"><\u002Fcircle>\n            <circle cx=\"80\" cy=\"80\" r=\"7\" fill=\"var(--mint-500)\"><\u002Fcircle>\n            <rect x=\"108\" y=\"72\" width=\"56\" height=\"20\" rx=\"10\" fill=\"var(--mint-500)\"><\u002Frect>\n            <text x=\"136\" y=\"86\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ink-950)\">01<\u002Ftext>\n          <\u002Fg>\n          <g id=\"node2\">\n            <circle cx=\"220\" cy=\"220\" r=\"13\" fill=\"var(--ink-200)\"><\u002Fcircle>\n            <circle cx=\"220\" cy=\"220\" r=\"4\" fill=\"var(--canvas)\"><\u002Fcircle>\n            <rect x=\"248\" y=\"212\" width=\"56\" height=\"20\" rx=\"10\" fill=\"var(--ink-50)\" stroke=\"var(--border-1)\"><\u002Frect>\n            <text x=\"276\" y=\"226\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--fg-3)\">02<\u002Ftext>\n          <\u002Fg>\n          <g id=\"node3\">\n            <circle cx=\"360\" cy=\"360\" r=\"13\" fill=\"var(--ink-200)\"><\u002Fcircle>\n            <circle cx=\"360\" cy=\"360\" r=\"4\" fill=\"var(--canvas)\"><\u002Fcircle>\n            <rect x=\"388\" y=\"352\" width=\"56\" height=\"20\" rx=\"10\" fill=\"var(--ink-50)\" stroke=\"var(--border-1)\"><\u002Frect>\n            <text x=\"416\" y=\"366\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--fg-3)\">03<\u002Ftext>\n          <\u002Fg>\n\n          <!-- corner ticks -->\n          <g stroke=\"var(--ink-950)\" stroke-width=\"1\" stroke-linecap=\"round\" opacity=\"0.35\">\n            <line x1=\"400\" y1=\"60\" x2=\"420\" y2=\"60\"><\u002Fline>\n            <line x1=\"410\" y1=\"50\" x2=\"410\" y2=\"70\"><\u002Fline>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div class=\"process-steps\">\n        <button class=\"process-step is-active reveal\" data-step=\"0\" onclick=\"setStep(0)\">\n          <div class=\"process-step-head\">\n            <span class=\"process-step-n\">01<\u002Fspan>\n            <span class=\"process-step-name\">\n              <span class=\"fr\">Diagnostic<\u002Fspan><span class=\"en\">Diagnose<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"process-step-dur\">\n              <span class=\"fr\">30 min · gratuit<\u002Fspan><span class=\"en\">30 min · free<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"process-step-body\">\n            <p class=\"process-step-blurb\">\n              <span class=\"fr\">Une visio de 30 minutes. On identifie vos 3 process les plus chronophages, on quantifie le temps perdu, on chiffre le ROI potentiel. Vous repartez avec un rapport — même sans signer.<\u002Fspan>\n              <span class=\"en\">A 30-minute video call. We identify your 3 most time-consuming processes, quantify the time lost, estimate the potential ROI. You leave with a report — even without signing.<\u002Fspan>\n            <\u002Fp>\n            <ul class=\"process-step-list\">\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Audit workflows + outils<\u002Fspan><span class=\"en\">Workflow + tool audit<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Mesure du temps perdu<\u002Fspan><span class=\"en\">Time-loss measurement<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Carte priorisée par ROI<\u002Fspan><span class=\"en\">ROI-ranked map<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Go / no-go écrit<\u002Fspan><span class=\"en\">Written go / no-go<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fbutton>\n\n        <button class=\"process-step reveal\" data-step=\"1\" data-delay=\"1\" onclick=\"setStep(1)\">\n          <div class=\"process-step-head\">\n            <span class=\"process-step-n\">02<\u002Fspan>\n            <span class=\"process-step-name\">\n              <span class=\"fr\">Construction<\u002Fspan><span class=\"en\">Build<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"process-step-dur\">\n              <span class=\"fr\">1–6 semaines · prix fixe<\u002Fspan><span class=\"en\">1–6 weeks · fixed price<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"process-step-body\">\n            <p class=\"process-step-blurb\">\n              <span class=\"fr\">Une fois ce qui mérite d'être construit identifié, on livre. Workflows, agents IA, mini-SaaS — directement intégrés dans vos outils. Vous validez à chaque étape. Formation incluse, documentation livrée.<\u002Fspan>\n              <span class=\"en\">Once we know what's worth building, we ship. Workflows, agents, small custom SaaS — built into your existing tools. You validate at each step. Training included, docs delivered.<\u002Fspan>\n            <\u002Fp>\n            <ul class=\"process-step-list\">\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Workflows · n8n / custom<\u002Fspan><span class=\"en\">Workflows · n8n / custom<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Agents · Claude / GPT / OSS<\u002Fspan><span class=\"en\">Agents · Claude / GPT / OSS<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Mini-SaaS · React + Postgres<\u002Fspan><span class=\"en\">Mini-SaaS · React + Postgres<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Intégré dans votre stack<\u002Fspan><span class=\"en\">Plugged into your stack<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fbutton>\n\n        <button class=\"process-step reveal\" data-step=\"2\" data-delay=\"2\" onclick=\"setStep(2)\">\n          <div class=\"process-step-head\">\n            <span class=\"process-step-n\">03<\u002Fspan>\n            <span class=\"process-step-name\">\n              <span class=\"fr\">Adoption<\u002Fspan><span class=\"en\">Adopt<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"process-step-dur\">\n              <span class=\"fr\">300–1 500 €/mois<\u002Fspan><span class=\"en\">€300–1,500/mo<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"process-step-body\">\n            <p class=\"process-step-blurb\">\n              <span class=\"fr\">On reste côté équipe le temps que le nouveau process devienne juste \"comment on fait les choses ici\". Monitoring, nouveaux workflows, veille IA, roadmap. Votre système grandit avec vous.<\u002Fspan>\n              <span class=\"en\">We stick around until the new way is just how the team works. Monitoring, new workflows, AI watch, roadmap. Your system grows with you.<\u002Fspan>\n            <\u002Fp>\n            <ul class=\"process-step-list\">\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Formation sur site + remote<\u002Fspan><span class=\"en\">On-site + remote training<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Adoption mesurée chaque semaine<\u002Fspan><span class=\"en\">Adoption tracked weekly<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">6 sem. d'itérations incluses<\u002Fspan><span class=\"en\">6 wks of iteration<\u002Fspan><\u002Fli>\n              <li><span class=\"cv\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fr\">Docs qui se lisent vraiment<\u002Fspan><span class=\"en\">Docs that get read<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     USE CASES\n============================================================ -->\n<section id=\"usecases\" class=\"usecases section-tall\">\n  <div class=\"container\">\n    <header class=\"uc-head reveal\">\n      <div class=\"eyebrow\">\n        <span class=\"dot\"><\u002Fspan>\n        <span class=\"fr\">Cas d'usage<\u002Fspan>\n        <span class=\"en\">Use cases<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"uc-title\">\n        <span class=\"fr\">Le problème n'est pas votre équipe.<br>C'est votre stack.<\u002Fspan>\n        <span class=\"en\">The problem isn't your team.<br>It's your stack.<\u002Fspan>\n      <\u002Fh2>\n      <p class=\"uc-sub\">\n        <span class=\"fr\">Vos outils ne se parlent pas. Vos process tournent à la main. Six exemples de ce qu'on remplace par un système qui marche tout seul.<\u002Fspan>\n        <span class=\"en\">Your tools don't talk to each other. Your processes run on human hands. Six examples of what we replace with systems that just work.<\u002Fspan>\n      <\u002Fp>\n    <\u002Fheader>\n\n    <div class=\"uc-grid\">\n      <!-- wide card 1 -->\n      <div class=\"uc-card wide reveal\">\n        <span class=\"uc-tag fr\">Emails<\u002Fspan>\n        <span class=\"uc-tag en\">Email<\u002Fspan>\n        <h3>\n          <span class=\"fr\">Vos emails vous noient.<\u002Fspan>\n          <span class=\"en\">Your inbox is drowning you.<\u002Fspan>\n        <\u002Fh3>\n        <p>\n          <span class=\"fr\">Chaque matin, 80 emails. 60 qui n'ont pas besoin de vous. Vous perdez 2h à trier avant même de commencer à travailler. On classe, on route, on rédige les réponses.<\u002Fspan>\n          <span class=\"en\">Every morning, 80 emails. 60 that don't need you. You spend 2 hours sorting before you can start working. We classify, route, and draft replies automatically.<\u002Fspan>\n        <\u002Fp>\n        <div class=\"uc-stat\">2h<span class=\"label fr\">économisées par jour<\u002Fspan><span class=\"label en\">saved per day<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- wide card 2 -->\n      <div class=\"uc-card wide reveal\" data-delay=\"1\">\n        <span class=\"uc-tag fr\">Comptabilité<\u002Fspan>\n        <span class=\"uc-tag en\">Accounting<\u002Fspan>\n        <h3>\n          <span class=\"fr\">Vos factures sont saisies à la main.<\u002Fspan>\n          <span class=\"en\">Your invoices are entered by hand.<\u002Fspan>\n        <\u002Fh3>\n        <p>\n          <span   <\u002Fdiv>\n      <div class=\"faq-row\">\n        <button class=\"faq-q\" onclick=\"toggleFaq(this)\">\n          <span>\n            <span class=\"fr\">On n'est pas du tout technologiques — c'est pour nous ?<\u002Fspan>\n            <span class=\"en\">We're not technical at all — is this for us?<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"faq-toggle\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"faq-a\">\n          <p class=\"fr\">C'est précisément pour vous. Votre rôle : décrire le problème, valider le résultat. Mon rôle : construire la solution. La formation incluse garantit que votre équipe maîtrise ce qui a été déployé — sans avoir besoin de comprendre le code.<\u002Fp>\n          <p class=\"en\">That's exactly who this is for. Your role: describe the problem, validate the result. My role: build the solution. The included training ensures your team masters what was deployed — without needing to understand the code.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-row\">\n        <button class=\"faq-q\" onclick=\"toggleFaq(this)\">\n          <span>\n            <span class=\"fr\">Mes données sont-elles en sécurité ?<\u002Fspan>\n            <span class=\"en\">Is my data secure?<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"faq-toggle\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"faq-a\">\n          <p class=\"fr\">Oui. Je n'héberge aucune de vos données. Tous les workflows tournent dans votre infrastructure ou via vos abonnements cloud. NDA signé avant toute prestation. Accès limité au strict nécessaire.<\u002Fp>\n          <p class=\"en\">Yes. I don't host any of your data. All workflows run in your infrastructure or via your own cloud subscriptions. NDA signed before any work begins. Access strictly limited to what's necessary.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-row\">\n        <button class=\"faq-q\" onclick=\"toggleFaq(this)\">\n          <span>\n            <span class=\"fr\">Comment fonctionne la garantie concrètement ?<\u002Fspan>\n            <span class=\"en\">How does the guarantee work in practice?<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"faq-toggle\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"faq-a\">\n          <p class=\"fr\">Si vous ne constatez pas 5 heures gagnées par mois dans les 30 jours post-déploiement, remboursement intégral. Une seule condition : que les workflows déployés aient été utilisés. On mesure avant/après ensemble — pas de flou, pas d'interprétation.<\u002Fp>\n          <p class=\"en\">If you don't see 5 hours saved per month in the 30 days post-deployment, full refund. One condition: the deployed workflows must have been used. We measure before/after together — no ambiguity, no interpretation.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-row\">\n        <button class=\"faq-q\" onclick=\"toggleFaq(this)\">\n          <span>\n            <span class=\"fr\">Qui est derrière Synopse ?<\u002Fspan>\n            <span class=\"en\">Who's behind Synopse?<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"faq-toggle\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\" ec un café et de la frustration.<\u002Fspan>\n      <span class=\"en\">Clermont-Ferrand · built with espresso and frustration.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ============================================================\n     SCRIPTS\n============================================================ -->\n<script>\n/* LANG */\nfunction setLang(l) {\n  document.body.className = 'lang-' + l;\n  document.getElementById('btn-fr').classList.toggle('active', l === 'fr');\n  document.getElementById('btn-en').classList.toggle('active', l === 'en');\n  document.documentElement.setAttribute('lang', l);\n  try { localStorage.setItem('syn-lang', l); } catch(e) {}\n}\ntry {\n  var sl = localStorage.getItem('syn-lang');\n  if (sl) setLang(sl);\n} catch(e) {}\n\n/* NAV scrolled */\nwindow.addEventListener('scroll', function() {\n  document.getElementById('navShell').classList.toggle('is-scrolled', window.scrollY > 24);\n}, { passive: true });\n\n/* REVEAL */\n(function() {\n  var io = new IntersectionObserver(function(entries) {\n    entries.forEach(function(e) {\n      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }\n    });\n  }, { threshold: 0.08, rootMargin: '0px 0px -8% 0px' });\n  function arm() {\n    document.querySelectorAll('.reveal:not(.armed)').forEach(function(el) {\n      var r = el.getBoundingClientRect();\n      var inView = r.top < window.innerHeight && r.bottom > 0;\n      el.classList.add('armed');\n      if (inView) {\n        requestAnimationFrame(function() {\n          requestAnimationFrame(function() { el.classList.add('in'); });\n        });\n      } else {\n        io.observe(el);\n      }\n    });\n  }\n  arm();\n})();\n\n/* PROCESS step interaction */\nfunction setStep(idx) {\n  document.querySelectorAll('.process-step').forEach(function(s, i) {\n    s.classList.toggle('is-active', i === idx);\n  });\n  // Update synapse arc nodes\n  var arcs = ['arc1', 'arc2'];\n  arcs.forEach(function(id, i) {\n    var p = document.getElementById(id);\n    if (p) p.classList.toggle('is-active', i < idx);\n  });\n  // Update node visuals\n  for (var i = 1; i <= 3; i++) {\n    var g = document.getElementById('node' + i);\n    if (!g) continue;\n    var circles = g.querySelectorAll('circle');\n    var rect = g.querySelector('rect');\n    var text = g.querySelector('text');\n    var reached = (i - 1) <= idx;\n    var active = (i - 1) === idx;\n    if (circles[0]) {\n      circles[0].setAttribute('r', active ? 18 : 13);\n      circles[0].setAttribute('fill', reached ? '#0E1413' : '#D2D9D5');\n    }\n    if (circles[1]) {\n      circles[1].setAttribute('r', active ? 7 : 4);\n      circles[1].setAttribute('fill', reached ? '#10B981' : '#FAFBFA');\n    }\n    if (rect) {\n      rect.setAttribute('fill', active ? '#10B981' : '#F5F7F6');\n      rect.setAttribute('stroke', active ? 'transparent' : '#E8ECEA');\n    }\n    if (text) {\n      text.setAttribute('fill', active ? '#0E1413' : '#828D88');\n    }\n  }\n}\n\n/* RESULTS bar animation */\n(function() {\n  var bo = new IntersectionObserver(function(entries) {\n    entries.forEach(function(e) {\n      if (e.isIntersecting) {\n        setTimeout(function() {\n          e.target.querySelectorAll('.res-bar').forEach(function(b, i) {\n            setTimeout(function() { b.style.width = b.dataset.w + '%'; }, i * 80);\n          });\n        }, 250);\n        bo.unobserve(e.target);\n      }\n    });\n  }, { threshold: 0.2 });\n  var rc = document.getElementById('resChart');\n  if (rc) bo.observe(rc);\n})();\n\n/* FAQ */\nfunction toggleFaq(btn) {\n  var row = btn.parentElement;\n  var was = row.classList.contains('is-open');\n  document.querySelectorAll('.faq-row.is-open').forEach(function(r) { r.classList.remove('is-open'); });\n  if (!was) row.classList.add('is-open');\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
